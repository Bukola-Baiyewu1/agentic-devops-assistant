global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: aegis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # If AEGIS_METRICS_TOKEN is set, uncomment and use the same value:
    # authorization:
    #   credentials: change-me

  - job_name: aegis-worker
    static_configs:
      - targets: ["worker:9100"]
